---
layout: default
---

<style>
    .papers-page {
        max-width: 900px;
    }

    .papers-page > h2 {
        font-size: 1.48rem;
        line-height: 1.25;
        margin: 0;
    }

    .papers-page > h2:not(:first-child) {
        border-top: 1px solid var(--site-rule);
        margin-top: 2.35rem;
        padding-top: 0.62rem;
    }

    .papers-list {
        counter-reset: papers;
        list-style: none;
        margin: 0.8rem 0 0;
        padding-left: 0;
    }

    .papers-list > li {
        counter-increment: papers;
        display: grid;
        column-gap: 0.45em;
        grid-template-columns: 2em minmax(0, 1fr);
        margin: 0;
        padding: 0.5rem 0 0.68rem;
    }

    .papers-list > li + li {
        margin-top: 0.42rem;
    }

    .papers-list > li::before {
        color: var(--site-muted);
        content: "[" counter(papers) "]";
        font-size: 0.9em;
        line-height: 1.58;
    }

    .papers-list > li > p {
        line-height: 1.58;
        margin: 0;
        min-width: 0;
        padding-left: 1.15em;
        text-indent: -1.15em;
    }
</style>

<div class="papers-page top-level-page" data-lang="en">
    {% include paper-list.html preprints_heading="Preprints" journal_heading="Journal papers" %}
</div>

<div class="papers-page top-level-page" data-lang="fr">
    {% include paper-list.html preprints_heading="Prépublications" journal_heading="Articles de revue" %}
</div>

<div class="papers-page top-level-page" data-lang="zh">
    {% include paper-list.html preprints_heading="预印本" journal_heading="期刊论文" %}
</div>
