<style>
/* Shared by every note. Content-specific figures and mathematics stay in each chapter. */
.note-page h3 { margin: 1.1em 0 .25em; }
.note-page h4 { margin: .85em 0 .25em; }
.note-page ul { padding-left: 1.35em; }
.note-page li { margin-bottom: .45em; }
.math-statement { background: #fbfbf8; border-left: 3px solid #333; margin: .9em 0; padding: .65em .85em; }
.math-statement.definition { border-left-color: #496d8a; }
.math-statement.theorem, .math-statement.proposition, .math-statement.lemma, .math-statement.corollary { border-left-color: #5f4b86; }
.math-statement.proof { border-left-color: #777; }
.math-statement p { margin: .35em 0; }
.statement-title { font-variant: small-caps; font-weight: bold; }
.note-permalink { color: inherit; text-decoration: none; }
.note-permalink:hover, .note-permalink:focus-visible { text-decoration: underline; }
.note-page [id] { scroll-margin-top: 1em; }
.note-page [id]:target { outline: 2px solid #b9cad7; outline-offset: 4px; }
.note-learning-goal { border-left: 3px solid #496d8a; padding: .5em .9em; background: #f5f7f8; line-height: 1.55; }
.note-external-input { border-left: 3px solid #aa8a48; padding: .5em .9em; background: #fcfaf4; }
.note-exercises, .note-projects { padding-left: 1.5em; }
.note-exercises { list-style: none; padding-left: 0; }
.note-exercises > li, .note-projects > li { margin: 1em 0; }
.note-exercises details, .note-projects details { border-left: 2px solid #d1cfc8; padding: .2em .8em; margin: .25em 0; }
.note-exercises summary, .note-projects summary { color: #173f72; cursor: pointer; padding: .25em 0; }
.note-exercise-topic { color: #555; margin-top: .25em; }
.note-exercise-topic::first-letter { text-transform: uppercase; }
.note-sources { border-top: 1px solid #dedbd3; margin-top: 1.6em; padding-top: .8em; line-height: 1.5; }
.note-sources h3 { margin-top: 0; }
.note-page pre { background: #f5f7f8; padding: 1em; overflow-x: auto; font-size: .85em; }
.note-comparison { margin: 1em 0; max-width: 680px; }
.note-comparison img { display: block; width: 100%; height: auto; }
.note-comparison figcaption { line-height: 1.5; margin-top: .5em; }
.note-table-scroll { overflow-x: auto; margin: 1em 0; }
.note-table-scroll table { width: 100%; border-collapse: collapse; font-size: .92em; }

.note-table-scroll th { background: #f5f7f8; }
.note-nav { display: flex; flex-wrap: wrap; gap: .75em; margin: .75em 0 1em; }
.note-nav a { white-space: nowrap; }

.note-proof { background: #fbfbf8; border-left: 3px solid #777; margin: .75em 0; padding: .55em .85em; }
.note-proof p { margin: .35em 0; }

.note-index-page .note-links li { margin-bottom: .55em; }
.note-index-page .note-links li:last-child { margin-bottom: 0; }
.note-index-page .note-part { margin: 1.4em 0; }
.note-index-page .note-part h3 { margin-bottom: .45em; }
.note-index-page .note-part .note-links { margin-top: 0; }
