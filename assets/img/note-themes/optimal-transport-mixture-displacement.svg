<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="title desc">
<title id="title">Mixture and displacement between two Dirac masses</title>
<desc id="desc">Three times: zero, one half, and one. The mixture keeps mass at zero and one. At the midpoint it splits equally. Displacement keeps all mass together and moves it from zero through one half to one. Circle area represents mass.</desc>
<rect width="680" height="300" fill="#fbfaf6"/>
<g font-family="Georgia,serif" font-size="21" fill="#172534"><text x="145" y="35">Mixture</text><text x="440" y="35">Displacement</text></g>
<g stroke="#b9b6af" stroke-width="2"><path d="M120 95H290 M430 95H600 M120 170H290 M430 170H600 M120 245H290 M430 245H600"/></g>
<g fill="#496d8a"><circle cx="120" cy="95" r="18"/><circle cx="120" cy="170" r="12.73"/><circle cx="290" cy="170" r="12.73"/><circle cx="290" cy="245" r="18"/></g>
<g fill="#8a5b46"><circle cx="430" cy="95" r="18"/><circle cx="515" cy="170" r="18"/><circle cx="600" cy="245" r="18"/></g>
<g font-family="Georgia,serif" font-size="19" fill="#20262b"><text x="15" y="102">t = 0</text><text x="15" y="177">t = ½</text><text x="15" y="252">t = 1</text><text x="115" y="285">0</text><text x="285" y="285">1</text><text x="425" y="285">0</text><text x="595" y="285">1</text></g>
</svg>